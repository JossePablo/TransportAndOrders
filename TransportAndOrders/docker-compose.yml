version: '3.8'
services:
  db:
    image: postgres:14
    container_name: transport_db
    environment:
      POSTGRES_USER: user_backend
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: transport_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_transport
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 12345
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres_data: